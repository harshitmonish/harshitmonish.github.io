<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-labelledby="title desc">
  <title id="title">Inference optimization stack</title><desc id="desc">A vertical stack from Model through Quantization, Compiler, Fusion, Runtime, Batching, and GPU.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#10233d"/></linearGradient><linearGradient id="node" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#173a5e"/><stop offset="1" stop-color="#0d2745"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000814" flood-opacity=".35"/></filter><marker id="a" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#5eead4"/></marker></defs>
  <rect width="1600" height="1180" fill="url(#bg)"/><g font-family="Inter,Arial,sans-serif" text-anchor="middle"><text x="800" y="82" fill="#f8fafc" font-size="48" font-weight="700">Inference Optimization Stack</text><text x="800" y="126" fill="#a8c1d9" font-size="23">Performance emerges from coordinated choices across the model, software stack, and hardware.</text></g>
  <g fill="none" stroke="#5eead4" stroke-width="6" marker-end="url(#a)"><path d="M800 264V306"/><path d="M800 394V436"/><path d="M800 524V566"/><path d="M800 654V696"/><path d="M800 784V826"/><path d="M800 914V956"/></g>
  <g font-family="Inter,Arial,sans-serif" text-anchor="middle" filter="url(#s)"><g><rect x="475" y="174" width="650" height="90" rx="20" fill="url(#node)" stroke="#5eead4" stroke-width="2"/><text x="800" y="231" fill="#f8fafc" font-size="34" font-weight="700">Model</text></g><g><rect x="475" y="304" width="650" height="90" rx="20" fill="url(#node)" stroke="#5eead4" stroke-width="2"/><text x="800" y="361" fill="#f8fafc" font-size="34" font-weight="700">Quantization</text></g><g><rect x="475" y="434" width="650" height="90" rx="20" fill="url(#node)" stroke="#5eead4" stroke-width="2"/><text x="800" y="491" fill="#f8fafc" font-size="34" font-weight="700">Compiler</text></g><g><rect x="475" y="564" width="650" height="90" rx="20" fill="url(#node)" stroke="#5eead4" stroke-width="2"/><text x="800" y="621" fill="#f8fafc" font-size="34" font-weight="700">Fusion</text></g><g><rect x="475" y="694" width="650" height="90" rx="20" fill="url(#node)" stroke="#5eead4" stroke-width="2"/><text x="800" y="751" fill="#f8fafc" font-size="34" font-weight="700">Runtime</text></g><g><rect x="475" y="824" width="650" height="90" rx="20" fill="url(#node)" stroke="#5eead4" stroke-width="2"/><text x="800" y="881" fill="#f8fafc" font-size="34" font-weight="700">Batching</text></g><g><rect x="475" y="954" width="650" height="90" rx="20" fill="#0c4a5a" stroke="#67e8f9" stroke-width="2"/><text x="800" y="1011" fill="#f8fafc" font-size="34" font-weight="700">GPU</text></g></g>
  <text x="800" y="1118" fill="#a8c1d9" font-family="Inter,Arial,sans-serif" font-size="23" text-anchor="middle">Measure first: each layer changes the bottleneck seen by the next.</text>
</svg>
