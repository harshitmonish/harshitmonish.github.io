<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Prefill versus decode in LLM inference</title>
  <desc id="desc">A two-panel diagram contrasting parallel, compute-bound prefill with sequential, memory-bound decode.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#10233d"/></linearGradient>
    <linearGradient id="prefill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#155e75"/><stop offset="1" stop-color="#0e3b59"/></linearGradient>
    <linearGradient id="decode" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#713f12"/><stop offset="1" stop-color="#472711"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000814" flood-opacity="0.35"/></filter>
    <marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12Z" fill="#5eead4"/></marker>
    <marker id="arrow-amber" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12Z" fill="#fbbf24"/></marker>
  </defs>
  <rect width="1600" height="980" fill="url(#bg)"/>
  <g font-family="Inter, Arial, sans-serif" text-anchor="middle">
    <text x="800" y="83" fill="#f8fafc" font-size="48" font-weight="700">Prefill vs. Decode</text>
    <text x="800" y="127" fill="#a8c1d9" font-size="23">LLM inference contains two workloads with fundamentally different execution profiles</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="92" y="185" width="666" height="650" rx="26" fill="#0a1f34" stroke="#2dd4bf" stroke-width="2"/>
    <rect x="842" y="185" width="666" height="650" rx="26" fill="#25180c" stroke="#fbbf24" stroke-width="2"/>
  </g>
  <g font-family="Inter, Arial, sans-serif" text-anchor="middle">
    <text x="425" y="255" fill="#f8fafc" font-size="36" font-weight="700">Prefill</text>
    <text x="425" y="292" fill="#94e9df" font-size="22">Process the entire prompt and build the KV cache</text>
    <text x="1175" y="255" fill="#f8fafc" font-size="36" font-weight="700">Decode</text>
    <text x="1175" y="292" fill="#fcd78c" font-size="22">Generate one token at a time from cached context</text>
  </g>
  <g fill="url(#prefill)" stroke="#5eead4" stroke-width="2" font-family="Inter, Arial, sans-serif" text-anchor="middle" filter="url(#shadow)">
    <rect x="155" y="370" width="120" height="74" rx="14"/><rect x="305" y="370" width="120" height="74" rx="14"/><rect x="455" y="370" width="120" height="74" rx="14"/><rect x="605" y="370" width="120" height="74" rx="14"/>
  </g>
  <g fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="650" text-anchor="middle"><text x="215" y="416">Token</text><text x="365" y="416">Token</text><text x="515" y="416">Token</text><text x="665" y="416">Token</text></g>
  <g stroke="#5eead4" stroke-width="5" marker-end="url(#arrow-teal)"><path d="M215 462V532"/><path d="M365 462V532"/><path d="M515 462V532"/><path d="M665 462V532"/></g>
  <rect x="188" y="555" width="474" height="105" rx="18" fill="#0f766e" stroke="#5eead4" stroke-width="2" filter="url(#shadow)"/>
  <g font-family="Inter, Arial, sans-serif" text-anchor="middle"><text x="425" y="600" fill="#f8fafc" font-size="30" font-weight="700">Parallel work</text><text x="425" y="633" fill="#c4f4ef" font-size="20">High arithmetic intensity and weight reuse</text></g>
  <rect x="194" y="704" width="462" height="72" rx="36" fill="#164e63" stroke="#67e8f9" stroke-width="2"/>
  <text x="425" y="751" fill="#cffafe" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="middle">Typically compute-bound</text>
  <g fill="url(#decode)" stroke="#fbbf24" stroke-width="2" font-family="Inter, Arial, sans-serif" text-anchor="middle" filter="url(#shadow)"><rect x="1085" y="350" width="180" height="66" rx="14"/><rect x="1085" y="466" width="180" height="66" rx="14"/><rect x="1085" y="582" width="180" height="66" rx="14"/><rect x="1085" y="698" width="180" height="66" rx="14"/></g>
  <g fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="650" text-anchor="middle"><text x="1175" y="393">Token</text><text x="1175" y="509">Token</text><text x="1175" y="625">Token</text><text x="1175" y="741">Token</text></g>
  <g stroke="#fbbf24" stroke-width="5" marker-end="url(#arrow-amber)"><path d="M1175 432V452"/><path d="M1175 548V568"/><path d="M1175 664V684"/></g>
  <rect x="940" y="784" width="470" height="72" rx="36" fill="#78350f" stroke="#fcd34d" stroke-width="2"/>
  <text x="1175" y="831" fill="#fef3c7" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="middle">Typically memory-bound</text>
  <g font-family="Inter, Arial, sans-serif" text-anchor="middle"><text x="800" y="925" fill="#a8c1d9" font-size="22">The serving runtime must schedule, batch, and optimize each phase differently.</text></g>
</svg>
