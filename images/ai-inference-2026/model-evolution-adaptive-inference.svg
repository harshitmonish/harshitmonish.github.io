<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">Model evolution toward adaptive inference</title><desc id="desc">A vertical progression from dense models through MoE, long context, reasoning, agents, and adaptive inference.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#10233d"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#173a5e"/><stop offset="1" stop-color="#0d2745"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000814" flood-opacity=".35"/></filter><marker id="a" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#5eead4"/></marker></defs>
  <rect width="1600" height="1120" fill="url(#bg)"/><g font-family="Inter,Arial,sans-serif" text-anchor="middle"><text x="800" y="82" fill="#f8fafc" font-size="48" font-weight="700">Model Evolution: Toward Adaptive Inference</text><text x="800" y="126" fill="#a8c1d9" font-size="23">Each step changes what the inference stack must optimize.</text></g>
  <g fill="none" stroke="#5eead4" stroke-width="6" marker-end="url(#a)"><path d="M800 270V310"/><path d="M800 400V440"/><path d="M800 530V570"/><path d="M800 660V700"/><path d="M800 790V830"/></g>
  <g font-family="Inter,Arial,sans-serif" text-anchor="middle" filter="url(#s)"><g><rect x="475" y="180" width="650" height="90" rx="20" fill="url(#n)" stroke="#5eead4" stroke-width="2"/><text x="800" y="238" fill="#f8fafc" font-size="34" font-weight="700">Dense Models</text></g><g><rect x="475" y="310" width="650" height="90" rx="20" fill="url(#n)" stroke="#5eead4" stroke-width="2"/><text x="800" y="368" fill="#f8fafc" font-size="34" font-weight="700">MoE</text></g><g><rect x="475" y="440" width="650" height="90" rx="20" fill="url(#n)" stroke="#5eead4" stroke-width="2"/><text x="800" y="498" fill="#f8fafc" font-size="34" font-weight="700">Long Context</text></g><g><rect x="475" y="570" width="650" height="90" rx="20" fill="url(#n)" stroke="#5eead4" stroke-width="2"/><text x="800" y="628" fill="#f8fafc" font-size="34" font-weight="700">Reasoning</text></g><g><rect x="475" y="700" width="650" height="90" rx="20" fill="url(#n)" stroke="#5eead4" stroke-width="2"/><text x="800" y="758" fill="#f8fafc" font-size="34" font-weight="700">Agents</text></g><g><rect x="475" y="830" width="650" height="90" rx="20" fill="#0c4a5a" stroke="#67e8f9" stroke-width="2"/><text x="800" y="888" fill="#f8fafc" font-size="34" font-weight="700">Adaptive Inference</text></g></g>
  <g font-family="Inter,Arial,sans-serif" text-anchor="middle" font-size="21"><text x="1230" y="237" fill="#a8c1d9">capacity</text><text x="1230" y="367" fill="#a8c1d9">sparse compute</text><text x="1230" y="497" fill="#a8c1d9">memory</text><text x="1230" y="627" fill="#a8c1d9">compute budget</text><text x="1230" y="757" fill="#a8c1d9">trajectories</text><text x="1230" y="887" fill="#a8c1d9">policy + routing</text></g>
  <text x="800" y="1015" fill="#cffafe" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="700" text-anchor="middle">The optimization target moves from a model execution to an intelligent execution policy.</text>
</svg>
