<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
  <title id="title">Traditional versus modern adaptive inference</title><desc id="desc">Traditional inference routes a request to one model then a response. Modern inference routes requests to fast, large, or reasoning paths that may use tools and repeat.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#10233d"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000814" flood-opacity=".35"/></filter><marker id="a" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#5eead4"/></marker><marker id="o" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#fb923c"/></marker></defs>
  <rect width="1600" height="940" fill="url(#bg)"/><g font-family="Inter,Arial,sans-serif" text-anchor="middle"><text x="800" y="82" fill="#f8fafc" font-size="48" font-weight="700">Modern Adaptive Inference</text><text x="800" y="126" fill="#a8c1d9" font-size="23">From one fixed model path to routing, tools, and adaptive compute.</text></g>
  <g filter="url(#s)"><rect x="90" y="185" width="540" height="625" rx="28" fill="#0a1f34" stroke="#4b91b9" stroke-width="2"/><rect x="700" y="185" width="810" height="625" rx="28" fill="#102035" stroke="#a78bfa" stroke-width="2"/></g>
  <g font-family="Inter,Arial,sans-serif" text-anchor="middle"><text x="360" y="252" fill="#f8fafc" font-size="35" font-weight="700">Traditional</text><text x="1105" y="252" fill="#f8fafc" font-size="35" font-weight="700">Modern</text></g>
  <g font-family="Inter,Arial,sans-serif" text-anchor="middle" font-size="27" font-weight="650"><rect x="196" y="350" width="328" height="72" rx="16" fill="#173a5e" stroke="#5eead4" stroke-width="2"/><text x="360" y="396" fill="#f8fafc">Request</text><rect x="196" y="500" width="328" height="72" rx="16" fill="#173a5e" stroke="#5eead4" stroke-width="2"/><text x="360" y="546" fill="#f8fafc">Model</text><rect x="196" y="650" width="328" height="72" rx="16" fill="#0c4a5a" stroke="#67e8f9" stroke-width="2"/><text x="360" y="696" fill="#f8fafc">Response</text></g><g stroke="#5eead4" stroke-width="6" marker-end="url(#a)"><path d="M360 442V478"/><path d="M360 592V628"/></g>
  <g font-family="Inter,Arial,sans-serif" text-anchor="middle" font-size="25" font-weight="650"><rect x="935" y="305" width="340" height="70" rx="16" fill="#4c1d95" stroke="#c4b5fd" stroke-width="2"/><text x="1105" y="350" fill="#f8fafc">Request</text><rect x="935" y="420" width="340" height="70" rx="16" fill="#4c1d95" stroke="#c4b5fd" stroke-width="2"/><text x="1105" y="465" fill="#f8fafc">Router</text><rect x="760" y="550" width="190" height="66" rx="14" fill="#173a5e" stroke="#5eead4" stroke-width="2"/><text x="855" y="592" fill="#f8fafc">Fast</text><rect x="1010" y="550" width="190" height="66" rx="14" fill="#173a5e" stroke="#5eead4" stroke-width="2"/><text x="1105" y="592" fill="#f8fafc">Large</text><rect x="1260" y="550" width="190" height="66" rx="14" fill="#713f12" stroke="#fb923c" stroke-width="2"/><text x="1355" y="592" fill="#f8fafc">Reasoning</text><rect x="1260" y="690" width="190" height="66" rx="14" fill="#7c2d12" stroke="#fb923c" stroke-width="2"/><text x="1355" y="732" fill="#f8fafc">Tools</text></g><g fill="none" stroke-width="5"><path d="M1105 510C1020 530 925 535 855 540" stroke="#5eead4" marker-end="url(#a)"/><path d="M1105 510V530" stroke="#5eead4" marker-end="url(#a)"/><path d="M1105 510C1190 530 1285 535 1355 540" stroke="#fb923c" marker-end="url(#o)"/><path d="M1355 636V668" stroke="#fb923c" marker-end="url(#o)"/><path d="M1260 723C1185 785 1060 785 1010 760" stroke="#fb923c" stroke-dasharray="11 10" marker-end="url(#o)"/></g><text x="1195" y="792" fill="#fed7aa" font-family="Inter,Arial,sans-serif" font-size="20" text-anchor="middle">tool result → model → …</text>
  <text x="800" y="875" fill="#a8c1d9" font-family="Inter,Arial,sans-serif" font-size="23" text-anchor="middle">The serving system allocates different models, reasoning budgets, and tool trajectories to different requests.</text>
</svg>
