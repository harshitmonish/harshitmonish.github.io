<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">KV cache growth with sequence length</title>
  <desc id="desc">A bar chart showing KV cache memory increasing linearly as context length grows from 1 thousand to 1 million tokens.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#10233d"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#075985"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="barhot" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#9a3412"/><stop offset="1" stop-color="#fb923c"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000814" flood-opacity="0.35"/></filter>
  </defs>
  <rect width="1600" height="980" fill="url(#bg)"/>
  <g font-family="Inter, Arial, sans-serif" text-anchor="middle"><text x="800" y="82" fill="#f8fafc" font-size="48" font-weight="700">KV Cache Growth with Sequence Length</text><text x="800" y="126" fill="#a8c1d9" font-size="23">For fixed model architecture, KV-cache memory grows approximately linearly with cached tokens.</text></g>
  <rect x="125" y="185" width="1040" height="630" rx="26" fill="#091c31" stroke="#214664" stroke-width="2"/>
  <g stroke="#315370" stroke-width="2" stroke-dasharray="8 10"><path d="M225 700H1090"/><path d="M225 570H1090"/><path d="M225 440H1090"/><path d="M225 310H1090"/></g>
  <g font-family="Inter, Arial, sans-serif" fill="#9fb8ce" font-size="20" text-anchor="end"><text x="205" y="707">0</text><text x="205" y="577">low</text><text x="205" y="447">medium</text><text x="205" y="317">high</text></g>
  <g filter="url(#shadow)"><rect x="275" y="685" width="105" height="15" rx="10" fill="url(#bar)"/><rect x="435" y="650" width="105" height="50" rx="10" fill="url(#bar)"/><rect x="595" y="555" width="105" height="145" rx="10" fill="url(#bar)"/><rect x="755" y="365" width="105" height="335" rx="10" fill="url(#bar)"/><rect x="915" y="225" width="105" height="475" rx="10" fill="url(#barhot)"/></g>
  <g font-family="Inter, Arial, sans-serif" text-anchor="middle" font-size="24" font-weight="700"><text x="327" y="750" fill="#d7e7f4">1K</text><text x="487" y="750" fill="#d7e7f4">8K</text><text x="647" y="750" fill="#d7e7f4">32K</text><text x="807" y="750" fill="#d7e7f4">128K</text><text x="967" y="750" fill="#fff0d5">1M</text></g>
  <text x="655" y="790" fill="#a8c1d9" font-family="Inter, Arial, sans-serif" text-anchor="middle" font-size="22">Cached sequence length (tokens)</text>
  <g font-family="Inter, Arial, sans-serif"><rect x="1210" y="235" width="285" height="398" rx="22" fill="#102a42" stroke="#2dd4bf" stroke-width="2"/><text x="1352" y="290" fill="#f8fafc" text-anchor="middle" font-size="29" font-weight="700">Why it grows</text><text x="1250" y="348" fill="#c8d9e8" font-size="22">Each cached token stores:</text><text x="1250" y="398" fill="#5eead4" font-size="24" font-weight="650">• Keys (K)</text><text x="1250" y="443" fill="#5eead4" font-size="24" font-weight="650">• Values (V)</text><text x="1250" y="505" fill="#c8d9e8" font-size="21">across every layer and</text><text x="1250" y="538" fill="#c8d9e8" font-size="21">KV attention head.</text><text x="1250" y="594" fill="#fcd34d" font-size="22" font-weight="650">Concurrency multiplies it.</text></g>
  <g font-family="Inter, Arial, sans-serif" text-anchor="middle"><rect x="180" y="860" width="1240" height="66" rx="33" fill="#164e63" stroke="#67e8f9" stroke-width="2"/><text x="800" y="903" fill="#cffafe" font-size="25" font-weight="650">Long-context serving is a memory-management problem: use GQA/MQA/MLA, KV quantization, paging, and prefix caching.</text></g>
</svg>
