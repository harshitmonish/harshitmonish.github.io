<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">Complete LLM inference stack</title>
  <desc id="desc">A vertical flow from Application through Router, Serving Runtime, Scheduler, Compiler, Kernel, GPU, and HBM or NVLink.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#10233d"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173a5e"/>
      <stop offset="1" stop-color="#0d2745"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000814" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#5eead4"/>
    </marker>
  </defs>
  <rect width="1600" height="1200" fill="url(#bg)"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="800" y="88" fill="#f8fafc" text-anchor="middle" font-size="48" font-weight="700">Complete LLM Inference Stack</text>
    <text x="800" y="132" fill="#a8c1d9" text-anchor="middle" font-size="23">From application-level policy to accelerator memory and interconnect</text>
  </g>
  <g fill="none" stroke="#5eead4" stroke-width="6" marker-end="url(#arrow)">
    <path d="M800 278V322"/><path d="M800 398V442"/><path d="M800 518V562"/>
    <path d="M800 638V682"/><path d="M800 758V802"/><path d="M800 878V922"/><path d="M800 998V1042"/>
  </g>
  <g font-family="Inter, Arial, sans-serif" text-anchor="middle" filter="url(#shadow)">
    <g><rect x="490" y="198" width="620" height="80" rx="18" fill="url(#node)" stroke="#4ccfbf" stroke-width="2"/><text x="800" y="250" fill="#f8fafc" font-size="31" font-weight="650">Application</text></g>
    <g><rect x="490" y="318" width="620" height="80" rx="18" fill="url(#node)" stroke="#4ccfbf" stroke-width="2"/><text x="800" y="370" fill="#f8fafc" font-size="31" font-weight="650">Router</text></g>
    <g><rect x="490" y="438" width="620" height="80" rx="18" fill="url(#node)" stroke="#4ccfbf" stroke-width="2"/><text x="800" y="490" fill="#f8fafc" font-size="31" font-weight="650">Serving Runtime</text></g>
    <g><rect x="490" y="558" width="620" height="80" rx="18" fill="url(#node)" stroke="#4ccfbf" stroke-width="2"/><text x="800" y="610" fill="#f8fafc" font-size="31" font-weight="650">Scheduler</text></g>
    <g><rect x="490" y="678" width="620" height="80" rx="18" fill="url(#node)" stroke="#4ccfbf" stroke-width="2"/><text x="800" y="730" fill="#f8fafc" font-size="31" font-weight="650">Compiler</text></g>
    <g><rect x="490" y="798" width="620" height="80" rx="18" fill="url(#node)" stroke="#4ccfbf" stroke-width="2"/><text x="800" y="850" fill="#f8fafc" font-size="31" font-weight="650">Kernel</text></g>
    <g><rect x="490" y="918" width="620" height="80" rx="18" fill="url(#node)" stroke="#4ccfbf" stroke-width="2"/><text x="800" y="970" fill="#f8fafc" font-size="31" font-weight="650">GPU</text></g>
    <g><rect x="490" y="1038" width="620" height="80" rx="18" fill="#0c4a5a" stroke="#5eead4" stroke-width="2"/><text x="800" y="1090" fill="#f8fafc" font-size="31" font-weight="650">HBM / NVLink</text></g>
  </g>
</svg>
